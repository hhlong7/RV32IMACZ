name: verification

on:
  push:
    branches: [main]
  pull_request:

jobs:
  regress:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install simulators
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog verilator python3 gcc-riscv64-unknown-elf

      - name: Verilator lint
        run: |
          verilator --lint-only --timing -Wall -Wno-fatal --top-module tb_core \
            -Wno-EOFNEWLINE \
            -Wno-DECLFILENAME \
            -Wno-PINCONNECTEMPTY \
            -Wno-MULTITOP \
            -Wno-TIMESCALEMOD \
            -Wno-WIDTHTRUNC \
            -Wno-WIDTHEXPAND \
            -Wno-UNUSEDSIGNAL \
            -Wno-CASEINCOMPLETE \
            -Wno-BLKSEQ \
            -Wno-LATCH \
            -f rtl.f \
            tb_core.sv

      # Spike has no Ubuntu package, so tools/lockstep.py reports
      # "status=skipped" here unless a Spike build step is added. Run it
      # locally (or add the step) for the reference-model comparison.
      - name: Run verification suite
        run: |
          bash tools/run_verification_quality.sh out/verification_logs

      - name: Upload verification artifacts
        uses: actions/upload-artifact@v4
        with:
          name: verification-logs
          path: out/verification_logs
